<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Lar</title>
    <link rel="icon" type="image/png" sizes="512x512" href="icon2.jpeg">
    <link rel="apple-touch-icon" sizes="180x180" href="icon2.jpeg">
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond&family=Pacifico&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        /* ======= ESTILO GLOBAL ======= */
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a1a, #2c3e50);
            color: white;
            font-family: 'EB Garamond', Georgia, serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding-top: 80px;
            opacity: 0;
            animation: fadeIn 1.5s ease-in-out forwards;
            transition: all 0.5s ease;
            overflow-x: hidden;
        }

        @keyframes fadeIn { to { opacity: 1; } }

        /* ======= MENU ======= */
        .menu {
            position: fixed;
            top: 0; left: 0; width: 100%;
            background-color: rgba(51, 51, 51, 0.9);
            text-align: center; padding: 15px 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 1000;
            display: flex; justify-content: space-around; gap: 10px;
            flex-wrap: nowrap; transition: all 0.5s ease;
        }
        .menu a {
            color: white; text-decoration: none; padding: 10px 20px;
            border-radius: 5px; transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            font-size: 1em; display: flex; align-items: center; gap: 8px; position: relative;
        }
        .menu a:hover { background-color: #555; transform: translateY(-2px); box-shadow: 0 0 10px rgba(255,255,255,0.5); }

        /* ======= CONTEÚDO ======= */
        .content { width: 90%; max-width: 800px; padding: 20px; box-sizing: border-box; margin: 0 auto; }
        .tab-content {
            display: none; opacity: 0;
            animation: fadeInTab 1s ease-in-out forwards;
        }
        @keyframes fadeInTab { to { opacity: 1; } }
        .active-tab { display: block; }

        /* ======= GALERIA DINÂMICA ======= */
        .dynamic-gallery {
            position: relative; height: 500px; overflow: hidden;
            margin-bottom: 30px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: all 0.5s ease;
        }
        .dynamic-gallery img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: 0; transition: opacity 1s ease-in-out; border-radius: 10px;
            cursor: pointer;
        }
        .dynamic-gallery img.active { opacity: 1; }

        /* ======= GALERIA ESTÁTICA ======= */
        .static-gallery { display: flex; flex-direction: column; gap: 20px; }
        .static-gallery .img-wrapper {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
        }
        .static-gallery img {
            width: 100%; height: auto; border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .static-gallery .img-wrapper:hover img {
            transform: scale(1.02);
            box-shadow: 0 6px 15px rgba(255,255,255,0.5);
        }
        .img-hover-text {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px;
            font-size: 0.9em;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .static-gallery .img-wrapper:hover .img-hover-text { opacity: 1; }

        /* ======= BOTÕES FIXOS ======= */
        .back-to-top, .theme-toggle, .christmas-toggle, .valentine-toggle, .envelope-btn {
            position: fixed; background-color: #333; color: white;
            padding: 10px 15px; border-radius: 50%; cursor: pointer;
            z-index: 1000; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
            width: 45px; height: 45px;
        }
        .back-to-top    { bottom: 20px;  right: 20px; opacity: 0; }
        .back-to-top.visible { opacity: 1; }
        .theme-toggle    { bottom: 80px;  right: 20px; }
        .christmas-toggle{ bottom: 140px; right: 20px; }
        .valentine-toggle{ bottom: 200px; right: 20px; }
        .envelope-btn    { bottom: 260px; right: 20px; }

        .back-to-top:hover, .theme-toggle:hover,
        .christmas-toggle:hover, .valentine-toggle:hover, .envelope-btn:hover {
            background-color: #555; transform: translateY(-5px);
        }
        .christmas-toggle.active { background-color: #c00; box-shadow: 0 0 10px rgba(255,215,0,0.7); }
        .valentine-toggle.active  { background-color: #e91e63; box-shadow: 0 0 15px rgba(255,105,180,0.8); }

        /* ======= TÍTULOS TEMÁTICOS ======= */
        .normal-title, .christmas-title, .valentine-title { transition: opacity 0.5s ease; margin-bottom: 20px; }
        .christmas-title, .valentine-title { opacity: 0; position: relative; }
        body.christmas-mode .christmas-title { opacity: 1; }
        body.valentine-mode .valentine-title { opacity: 1; }
        body.christmas-mode .normal-title, body.valentine-mode .normal-title { display: none; }
        .christmas-title::before, .christmas-title::after { content: "🎄"; margin: 0 10px; }
        .valentine-title::before, .valentine-title::after { content: "❤️"; margin: 0 10px; }
        .valentine-title { color: #ff3366; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

        /* ======= MODO CLARO/ESCURO ======= */
        body.light-mode { background: linear-gradient(135deg, #f0f0f0, #d3d3d3); color: #333; }
        body.light-mode .menu { background-color: rgba(255,255,255,0.9); }
        body.light-mode .menu a { color: #333; }
        body.light-mode .menu a:hover { background-color: #ddd; }
        body.light-mode .quote { color: #555; }
        body.light-mode .author { color: #777; }

        /* ======= NEVE / CORAÇÕES ======= */
        .snowflake, .heartfall {
            position: fixed; top: -10px; color: white; font-size: 1em;
            animation: fall linear forwards; z-index: 9999; pointer-events: none;
            opacity: 0; transition: opacity 0.5s ease;
        }
        @keyframes fall { to { transform: translateY(100vh); opacity: 0; } }

        /* Coração de clique */
        .click-heart {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 1.5rem;
            animation: heartPop 0.8s ease-out forwards;
        }
        @keyframes heartPop {
            0% { transform: scale(0) translateY(0); opacity: 1; }
            100% { transform: scale(1.5) translateY(-80px); opacity: 0; }
        }

        /* ======= TEMA NATALINO ======= */
        body.christmas-mode { background: linear-gradient(135deg, #0a2e1d, #1a3b29); }
        body.christmas-mode .menu { background-color: rgba(139,0,0,0.9); border-bottom: 2px solid #0a2e1d; }
        body.christmas-mode .menu a { background-color: rgba(0,100,0,0.3); }
        body.christmas-mode .menu a:hover { background-color: #8B0000; box-shadow: 0 0 10px rgba(255,215,0,0.7); }
        body.christmas-mode .dynamic-gallery { border: 2px solid #c00; }
        body.christmas-mode .static-gallery img { border: 1px solid #c00; }
        body.christmas-mode .static-gallery img:hover { box-shadow: 0 6px 15px rgba(255,215,0,0.7); }
        body.christmas-mode .back-to-top { background-color: #8B0000; border: 1px solid #FFD700; }
        body.christmas-mode .theme-toggle { background-color: #8B0000; border: 1px solid #FFD700; }
        body.christmas-mode footer { background-color: rgba(139,0,0,0.9); color: #FFD700; border-top: 2px solid #0a2e1d; }
        body.christmas-mode footer a { color: #FFD700; }
        body.christmas-mode .quote { background-color: rgba(0,100,0,0.2); border-left: 4px solid #c00; }
        body.christmas-mode .author { color: #FFD700; }
        body.christmas-mode .audio-container { background-color: rgba(139,0,0,0.8); border: 1px solid #FFD700; }

        /* ======= TEMA DIA DOS NAMORADOS ======= */
        body.valentine-mode { background: linear-gradient(135deg, #e91e63, #f48fb1); }
        body.valentine-mode .menu { background-color: rgba(200,50,100,0.9); border-bottom: 2px solid #ff3366; }
        body.valentine-mode .menu a { background-color: rgba(255,105,180,0.2); }
        body.valentine-mode .menu a:hover { background-color: #ff3366; box-shadow: 0 0 15px rgba(255,105,180,0.8); }
        body.valentine-mode .dynamic-gallery { border: 2px solid #ff3366; }
        body.valentine-mode .static-gallery img { border: 1px solid #ff3366; }
        body.valentine-mode .static-gallery img:hover { box-shadow: 0 6px 15px rgba(255,105,180,0.8); }
        body.valentine-mode .back-to-top { background-color: #ff3366; border: 1px solid #fff; }
        body.valentine-mode .theme-toggle { background-color: #ff3366; border: 1px solid #fff; }
        body.valentine-mode footer { background-color: rgba(200,50,100,0.9); color: white; border-top: 2px solid #ff3366; }
        body.valentine-mode footer a { color: white; }
        body.valentine-mode .quote { background-color: rgba(255,105,180,0.15); border-left: 4px solid #ff3366; }
        body.valentine-mode .author { color: #ffebee; }
        body.valentine-mode .audio-container { background-color: rgba(200,50,100,0.8); border: 1px solid #fff; }

        /* ======= MODAL CARTA ======= */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            display: none;
            align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: #2c2c2c;
            color: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            text-align: left;
            position: relative;
            max-height: 80vh;
            overflow-y: auto;
            font-family: 'EB Garamond', serif;
            font-size: 1.2em;
            line-height: 1.6;
            border: 2px solid #ff3366;
        }
        .modal-close {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 1.5em;
            cursor: pointer;
            color: #ff3366;
        }
        .carta-texto {
            white-space: pre-wrap;
        }
        .cursor-blink {
            display: inline;
            animation: blink 0.7s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* ======= LIGHTBOX ======= */
        .lightbox {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 3000;
            display: none;
            align-items: center; justify-content: center;
            flex-direction: column;
        }
        .lightbox.active { display: flex; }
        .lightbox img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255,255,255,0.3);
        }
        .lightbox-close {
            position: absolute;
            top: 20px; right: 30px;
            font-size: 2em;
            color: white;
            cursor: pointer;
        }
        .lightbox-nav {
            display: flex; gap: 30px; margin-top: 20px;
        }
        .lightbox-nav i {
            font-size: 2em;
            color: white;
            cursor: pointer;
            padding: 10px;
            transition: color 0.3s;
        }
        .lightbox-nav i:hover { color: #ff3366; }

        /* ======= RODAPÉ E ÁUDIO ======= */
        footer {
            margin-top: 50px; padding: 20px;
            background-color: rgba(51,51,51,0.9); width: 100%;
            text-align: center; font-size: 0.9em; color: #ccc; transition: all 0.5s ease;
        }
        footer a { color: #ccc; text-decoration: none; transition: color 0.3s ease; }
        footer a:hover { color: #fff; }
        .audio-container {
            position: fixed; bottom: 20px; left: 20px; z-index: 1000;
            background-color: rgba(51,51,51,0.8); padding: 10px; border-radius: 10px;
            transition: all 0.5s ease;
        }
        .audio-container audio { width: 200px; }

        /* Corações estáticos do Dia dos Namorados */
        .static-hearts {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 998; opacity: 0; transition: opacity 0.5s ease;
        }
        body.valentine-mode .static-hearts { opacity: 1; }
        .static-hearts span {
            position: absolute; color: rgba(255,255,255,0.15); font-size: 2rem;
            animation: floatHeart 4s ease-in-out infinite;
        }
        @keyframes floatHeart {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
    </style>
</head>
<body>

    <!-- Corações flutuantes de fundo -->
    <div class="static-hearts" id="staticHearts"></div>

    <!-- Menu -->
    <div class="menu" id="menu">
        <a href="#" onclick="showTab('meu-mundo')"><i class="fas fa-globe"></i> Mundo</a>
        <a href="#" onclick="showTab('meus-pensamentos')"><i class="fas fa-brain"></i> Pensamentos</a>
        <a href="#" onclick="showTab('minhas-vivencias')"><i class="fas fa-heart"></i> Vivências</a>
    </div>

    <!-- Botões fixos -->
    <div class="back-to-top" id="backToTop"><i class="fas fa-arrow-up"></i></div>
    <div class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></div>
    <div class="christmas-toggle" id="christmasToggle"><i class="fas fa-snowflake"></i></div>
    <div class="valentine-toggle" id="valentineToggle"><i class="fas fa-heart"></i></div>
    <div class="envelope-btn" id="envelopeBtn"><i class="fas fa-envelope"></i></div>

    <!-- Modal da Carta -->
    <div class="modal-overlay" id="cartaModal">
        <div class="modal-content">
            <span class="modal-close" id="fecharCarta">&times;</span>
            <div class="carta-texto" id="cartaTexto"></div>
            <span class="cursor-blink" id="cursor">|</span>
        </div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="fecharLightbox">&times;</span>
        <img src="" alt="Lightbox" id="lightboxImg">
        <div class="lightbox-nav">
            <i class="fas fa-chevron-left" id="lightboxPrev"></i>
            <i class="fas fa-chevron-right" id="lightboxNext"></i>
        </div>
    </div>

    <!-- Conteúdo das abas (carregadas externamente) -->
    <div class="content" id="content">
        <h1 class="normal-title">Meu Lar</h1>
        <h1 class="christmas-title">Meu Lar - Feliz Natal</h1>
        <h1 class="valentine-title">Meu Lar - Feliz Dia dos Namorados</h1>

        <div id="meu-mundo" class="tab-content active-tab" data-file="abas/meu-mundo.html"></div>
        <div id="meus-pensamentos" class="tab-content" data-file="abas/meus-pensamentos.html"></div>
        <div id="minhas-vivencias" class="tab-content" data-file="abas/minhas-vivencias.html"></div>
    </div>

    <!-- Footer -->
    <footer>
        <p>❤️ <span class="normal-footer"></span> <span class="christmas-footer">Feliz Natal e um Ano Novo repleto de amor, meu amor!</span> <span class="valentine-footer">Feliz Dia dos Namorados, meu amor!</span> ❤️</p>
    </footer>

    <!-- Áudio -->
    <div class="audio-container">
        <audio controls autoplay loop>
            <source src="dezembro.mp3" type="audio/mpeg">
            Seu navegador não suporta o elemento de áudio.
        </audio>
    </div>

    <script>
        // ==================== CONFIGURAÇÕES ====================
        // Mensagem da carta secreta
        const cartaMensagem = `Meu amor,

Escrevo esta carta para dizer o quanto você é especial.

Cada momento ao seu lado é um presente que guardo no coração.

Obrigado por existir e por fazer da minha vida algo tão lindo.

Com todo o meu amor,
Para sempre seu. ❤️`;

        // Legendas para as fotos estáticas (índice corresponde à ordem das imagens no HTML)
        const legendasEstaticas = [
            "Nosso primeiro encontro",
            "Aquele sorriso que me conquistou",
            "Dia inesquecível no parque",
            "Nossa viagem dos sonhos",
            "Rindo à toa juntos",
            // Adicione quantas legendas quiser. Se faltar legenda, não aparece hover-text.
        ];

        // ==================== CARREGAMENTO DE ABAS ====================
        async function loadTabContent(tabId) {
            const tabElement = document.getElementById(tabId);
            if (!tabElement || tabElement.dataset.loaded === 'true') return;

            const filePath = tabElement.dataset.file;
            if (!filePath) return;

            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error('Erro ao carregar ' + filePath);
                const html = await response.text();
                tabElement.innerHTML = html;
                tabElement.dataset.loaded = 'true';

                if (tabId === 'meu-mundo') {
                    initDynamicGallery();
                    aplicarLegendasEstaticas();
                    initLightbox();
                }
                // Removida a chamada para initBotaoFraseAleatoria()
            } catch (error) {
                tabElement.innerHTML = '<p>Erro ao carregar conteúdo.</p>';
                console.error(error);
            }
        }

        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active-tab'));
            const activeTab = document.getElementById(tabName);
            if (!activeTab) return;
            activeTab.classList.add('active-tab');
            loadTabContent(tabName);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const initialTab = document.querySelector('.tab-content.active-tab');
            if (initialTab) loadTabContent(initialTab.id);
        });

        // ==================== GALERIA DINÂMICA ====================
        let galleryInterval;
        function initDynamicGallery() {
            const gallery = document.querySelector('.dynamic-gallery');
            if (!gallery) return;
            if (galleryInterval) clearInterval(galleryInterval);

            const images = gallery.querySelectorAll('img');
            if (images.length === 0) return;
            images.forEach((img, idx) => {
                if (idx === 0) img.classList.add('active');
                else img.classList.remove('active');
            });

            let currentIndex = 0;
            galleryInterval = setInterval(() => {
                images[currentIndex].classList.remove('active');
                currentIndex = (currentIndex + 1) % images.length;
                images[currentIndex].classList.add('active');
            }, 3000);

            // Re-inicializa lightbox para as novas imagens
            initLightbox();
        }

        // ==================== LEGENDAS HOVER (funcionalidade 4) ====================
        function aplicarLegendasEstaticas() {
            const wrappers = document.querySelectorAll('.static-gallery .img-wrapper');
            wrappers.forEach((wrapper, index) => {
                const existente = wrapper.querySelector('.img-hover-text');
                if (existente) existente.remove();

                if (index < legendasEstaticas.length) {
                    const hoverText = document.createElement('div');
                    hoverText.className = 'img-hover-text';
                    hoverText.textContent = legendasEstaticas[index];
                    wrapper.appendChild(hoverText);
                }
            });
        }

        // ==================== LIGHTBOX (funcionalidade 10) ====================
        let todasImagens = [];
        let indiceLightbox = 0;

        function initLightbox() {
            const din = document.querySelectorAll('.dynamic-gallery img');
            const est = document.querySelectorAll('.static-gallery img');
            todasImagens = [...din, ...est];

            todasImagens.forEach((img, idx) => {
                img.addEventListener('click', (e) => {
                    e.stopPropagation();
                    abrirLightbox(idx);
                });
            });
        }

        function abrirLightbox(index) {
            indiceLightbox = index;
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImg');
            img.src = todasImagens[indiceLightbox].src;
            lightbox.classList.add('active');
        }

        document.getElementById('fecharLightbox').addEventListener('click', () => {
            document.getElementById('lightbox').classList.remove('active');
        });
        document.getElementById('lightboxPrev').addEventListener('click', () => {
            indiceLightbox = (indiceLightbox - 1 + todasImagens.length) % todasImagens.length;
            document.getElementById('lightboxImg').src = todasImagens[indiceLightbox].src;
        });
        document.getElementById('lightboxNext').addEventListener('click', () => {
            indiceLightbox = (indiceLightbox + 1) % todasImagens.length;
            document.getElementById('lightboxImg').src = todasImagens[indiceLightbox].src;
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                document.getElementById('lightbox').classList.remove('active');
            }
        });

        // ==================== BOTÃO VOLTAR AO TOPO ====================
        window.addEventListener('scroll', () => {
            document.getElementById('backToTop').classList.toggle('visible', window.scrollY > 300);
        });
        document.getElementById('backToTop').addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ==================== TEMA CLARO/ESCURO ====================
        const themeToggle = document.getElementById('themeToggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const icon = themeToggle.querySelector('i');
            icon.classList.toggle('fa-moon');
            icon.classList.toggle('fa-sun');
        });

        // ==================== EFEITOS DE NEVE E CORAÇÕES ====================
        function createFallingElement(type) {
            const el = document.createElement('div');
            el.classList.add(type === 'snow' ? 'snowflake' : 'heartfall');
            el.innerHTML = type === 'snow' ? '❄' : '❤️';
            el.style.left = Math.random() * window.innerWidth + 'px';
            const size = Math.random() * 20 + 10;
            el.style.fontSize = size + 'px';
            const duration = Math.random() * 10 + 5;
            el.style.animationDuration = duration + 's';
            el.style.opacity = Math.random() * 0.7 + 0.3;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), duration * 1000);
        }

        let snowInterval, heartInterval;
        function startSnow() {
            stopSnow();
            snowInterval = setInterval(() => createFallingElement('snow'), 100);
        }
        function stopSnow() { clearInterval(snowInterval); document.querySelectorAll('.snowflake').forEach(el => el.remove()); }
        function startHearts() {
            stopHearts();
            heartInterval = setInterval(() => createFallingElement('heart'), 120);
        }
        function stopHearts() { clearInterval(heartInterval); document.querySelectorAll('.heartfall').forEach(el => el.remove()); }

        // ==================== CORAÇÕES NOS CLIQUES (funcionalidade 7) ====================
        document.addEventListener('click', (e) => {
            const heart = document.createElement('div');
            heart.className = 'click-heart';
            heart.innerHTML = '❤️';
            heart.style.left = e.clientX - 12 + 'px';
            heart.style.top = e.clientY - 12 + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 800);
        });

        // ==================== TOGGLE NATAL ====================
        const christmasToggle = document.getElementById('christmasToggle');
        christmasToggle.addEventListener('click', () => {
            const body = document.body;
            if (!body.classList.contains('christmas-mode')) {
                body.classList.remove('valentine-mode');
                stopHearts();
                valentineToggle.classList.remove('active');
            }
            body.classList.toggle('christmas-mode');
            christmasToggle.classList.toggle('active');
            body.classList.contains('christmas-mode') ? startSnow() : stopSnow();
        });

        // ==================== TOGGLE DIA DOS NAMORADOS ====================
        const valentineToggle = document.getElementById('valentineToggle');
        valentineToggle.addEventListener('click', () => {
            const body = document.body;
            if (!body.classList.contains('valentine-mode')) {
                body.classList.remove('christmas-mode');
                stopSnow();
                christmasToggle.classList.remove('active');
            }
            body.classList.toggle('valentine-mode');
            valentineToggle.classList.toggle('active');
            if (body.classList.contains('valentine-mode')) {
                startHearts();
                generateStaticHearts();
            } else {
                stopHearts();
                document.getElementById('staticHearts').innerHTML = '';
            }
        });

        function generateStaticHearts() {
            const container = document.getElementById('staticHearts');
            container.innerHTML = '';
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('span');
                heart.textContent = '❤️';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.top = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 3 + 's';
                heart.style.fontSize = (Math.random() * 30 + 15) + 'px';
                container.appendChild(heart);
            }
        }

        // ==================== CARTA SECRETA (funcionalidade 3) ====================
        const envelopeBtn = document.getElementById('envelopeBtn');
        const cartaModal = document.getElementById('cartaModal');
        const fecharCarta = document.getElementById('fecharCarta');
        const cartaTexto = document.getElementById('cartaTexto');
        const cursor = document.getElementById('cursor');

        envelopeBtn.addEventListener('click', () => {
            cartaModal.classList.add('active');
            cartaTexto.textContent = '';
            cursor.style.display = 'inline';
            digitarCarta(cartaMensagem);
        });

        fecharCarta.addEventListener('click', () => {
            cartaModal.classList.remove('active');
        });

        function digitarCarta(texto) {
            let i = 0;
            cartaTexto.textContent = '';
            const intervalo = setInterval(() => {
                if (i < texto.length) {
                    cartaTexto.textContent += texto.charAt(i);
                    i++;
                } else {
                    clearInterval(intervalo);
                    cursor.style.display = 'none';
                }
            }, 30);
        }
    </script>
</body>
</html>
